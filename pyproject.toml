[project]
name = "en3160-assignments"
version = "0.1.0"
description = "VS Code notebook environment for EN3160 assignments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29,<7",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "opencv-python>=4.11,<6",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
